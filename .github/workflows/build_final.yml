
name: Build Final Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unzip Flutter project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f pubspec.yaml ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p _flutter_extracted
              unzip -oq "$ZIP_FILE" -d _flutter_extracted
            fi

            PROJECT_YAML="$(find . -maxdepth 5 -type f -name pubspec.yaml -print -quit)"
            if [ -z "$PROJECT_YAML" ]; then
              echo "::error::pubspec.yaml not found in repository or ZIP"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PROJECT_YAML")"
            if [ "$PROJECT_DIR" != "." ]; then
              cp -a "$PROJECT_DIR"/. ./
            fi
          fi

          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter project found."
          cat pubspec.yaml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/prepare_android.py
          python3 tools/prepare_android.py

      - name: Get dependencies
        run: flutter pub get --verbose

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Grocery-Debt-App
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
