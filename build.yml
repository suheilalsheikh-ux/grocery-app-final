name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Auto Find and Unzip Project
      run: |
        find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;
        PUBSPEC_DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
        echo "Found pubspec.yaml in: $PUBSPEC_DIR"
        if [ "$PUBSPEC_DIR" != "." ] && [ -n "$PUBSPEC_DIR" ]; then
          cp -r "$PUBSPEC_DIR"/* .
          cp -r "$PUBSPEC_DIR"/.* . 2>/dev/null || true
        fi
        ls -la

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Python & prepare android
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - run: |
        find . -name "prepare_android.py" -exec python {} \; || true

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Fix SDK version & Get dependencies
      run: |
        find . -name "pubspec.yaml" -exec sed -i 's/>=3.12.0/>=3.0.0/g' {} +
        find . -name "pubspec.yaml" -exec sed -i 's/>=3.10.0/>=3.0.0/g' {} +
        flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Smart-Grocery-Debt-App
        path: build/app/outputs/flutter-apk/app-release.apk
